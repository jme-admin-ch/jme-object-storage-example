x-rustfs-common: &rustfs-common
  image: rustfs/rustfs:1.0.0-beta.8
  environment:
    RUSTFS_VOLUMES: /data
    RUSTFS_ADDRESS: 0.0.0.0:9000
    RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
    RUSTFS_ACCESS_KEY: rustfsadmin
    RUSTFS_SECRET_KEY: rustfsadmin
    RUSTFS_CONSOLE_ENABLE: "true"
    RUSTFS_REGION: us-east-1
    http_proxy: ''
    https_proxy: ''
    HTTP_PROXY: ''
    HTTPS_PROXY: ''
  healthcheck:
    test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health && curl -fsS http://127.0.0.1:9001/rustfs/console/health" ]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 40s

services:

  rustfs:
    <<: *rustfs-common
    hostname: rustfs
    depends_on:
      rustfs-volume-permission-helper:
        condition: service_completed_successfully
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data

  rustfs-volume-permission-helper:
    image: alpine:3.24.1
    volumes:
      - rustfs-data:/data
    command: sh -c "chown -R 10001:10001 /data"

  rustfs_init:
    image: amazon/aws-cli:2.36.5
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until aws --endpoint-url http://rustfs:9000 --cli-connect-timeout 5 s3api list-buckets; do
        echo 'Waiting for RustFS...';
        sleep 2;
      done;
      "
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_DEFAULT_REGION: us-east-1
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      http_proxy: ''
      https_proxy: ''
      NO_PROXY: 'rustfs,localhost,127.0.0.1'
      no_proxy: 'rustfs,localhost,127.0.0.1'


volumes:
  rustfs-data:
