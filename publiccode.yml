    localisedName: jme-object-storage-example
    shortDescription: Example project demonstrating the usage of the jEAP Object Storage Starter.
    longDescription: >
      This example project demonstrates how to use the jEAP Object Storage Starter, including setup, 
      configuration and integration. This example can create or delete buckets, upload and download files, 
      and list the contents of a bucket. It is intended to serve as a reference for developers looking 
      to integrate object storage capabilities into their own applications.
